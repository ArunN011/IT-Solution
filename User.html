<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="user.css">
</head>

<body>

<div class="dashboard">

  
  <div class="sidebar">
    <h3 class="logo">Stackly</h3>

    <ul>
      <li class="active"><a href="user.html"><i class="bi bi-grid"></i> Dashboard</a></li>
      <li><a href="usertask.html"><i class="bi bi-list-task"></i> Tasks</a></li>
      <li><a href="index.html"><i class="bi bi-house"></i> Home</a></li>
    </ul>

    <p class="menu-title">GENERAL</p>
    <ul>
      <li><a href="error.html"><i class="bi bi-gear"></i> Settings</a></li>
      <li><a href="error.html"><i class="bi bi-question-circle"></i> Help</a></li>
      <li><a href="index.html"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
    </ul>
  </div>

  <div class="overlay" onclick="toggleMenu()"></div>

  <div class="main">

   <div class="topbar">

  
  <i class="bi bi-list menu-toggle" onclick="toggleMenu()"></i>

 
  <div class="search">
    <input type="text" placeholder="Search...">
  </div>

 
  <div class="right">
    <i class="bi bi-bell"></i>

    <div class="profile">
      <img src="https://i.pravatar.cc/40">
      <div>
        <strong id="userName">User</strong>
        <p id="userEmail"></p>
      </div>
    </div>
  </div>

</div>

    <h3 class="title">Welcome Back 👋</h3>

  
    <div class="row g-3">
      <div class="col-md-4">
        <div class="card-box purple">
          <p>Balance</p>
          <h2>$10,469</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-box">
          <p>Tasks</p>
          <h2>12</h2>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card-box">
          <p>Completed</p>
          <h2>8</h2>
        </div>
      </div>
    </div>

    <div class="row mt-3">
      <div class="col-lg-8">
        <div class="box">
          <h5>Performance</h5>
          <canvas id="lineChart"></canvas>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="box">
          <h5>Status</h5>
          <canvas id="pieChart"></canvas>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="user.js"></script>
</body>
</html>
