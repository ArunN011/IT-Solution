<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<link rel="stylesheet" href="register.css">
</head>

<body>

<div class="container-box">

  <a href="index.html" class="back">
    <i class="bi bi-arrow-left"></i> Back to Home
  </a>

  <div class="card-box">

    <div class="logo">
      <i class="bi bi-bezier2"></i>
    </div>

    <h2>Create Your Account</h2>
    <p>Join Stackly IT Solution and start your journey</p>

    <form id="registerForm">

      <div class="row">
        <div class="col-md-6 input-box">
          <label>Full Name</label>
          <input type="text" placeholder="Enter name" required>
        </div>

        <div class="col-md-6 input-box">
          <label>Role</label>
          <select required>
            <option  disabled selected="">Select role</option>
            <option>Admin</option>
            <option>User</option>
          </select>
        </div>
      </div>

      <div class="input-box">
        <label>Email</label>
        <input type="email" placeholder="Enter email" required>
      </div>

   

      <div class="row">
        <div class="col-md-6 input-box password-box">
          <label>Password</label>
          <input type="password" id="password" required>
          <i class="bi bi-eye" onclick="togglePassword('password', this)"></i>
        </div>

        <div class="col-md-6 input-box password-box">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required>
          <i class="bi bi-eye" onclick="togglePassword('confirmPassword', this)"></i>
        </div>
      </div>

      <div class="check">
        <input type="checkbox" required>
        <label>I agree to Terms & Privacy</label>
      </div>

      <button type="submit" class="btn-submit">Create Account</button>

    </form>

    <p class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </p>

  </div>
</div>

<script src="register.js"></script>
</body>
</html>
