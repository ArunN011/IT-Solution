<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login  IT Solution</title>

<link rel="stylesheet" href="login.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>

<div class="login-container">

 
  <a href="index.html" class="back-btn">
    <i class="bi bi-arrow-left"></i> Back to Home
  </a>

  <div class="login-card">

    <div class="icon">
      <i class="bi bi-person-circle"></i>
    </div>

    <h2>Welcome Back</h2>
    <p>Login to access your Stackly IT Solution account</p>
     <form onsubmit="login(event)">
   <label>Login As</label>

<div class="input-box select-box">
  <i class="bi bi-person-badge"></i>
  
  <select id="role" required>
    <option value="" disabled selected >Select One</option>
    <option value="admin">Admin</option>
    <option value="user">User</option>
  </select>
</div>
    
    <label>Email Address</label>
    <div class="input-box" >
      <i class="bi bi-envelope"></i>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <label>Password</label>
    <div class="input-box">
      <i class="bi bi-lock"></i>
      <input type="password" id="password" required>
      <i class="bi bi-eye-slash toggle" onclick="togglePassword()"></i>
    </div>

 
    <div class="options">
      <label><input type="checkbox" required> Remember me</label>
      <a href="error.html">Forgot password?</a>
    </div>


    <button onclick="login()">Login to Dashboard</button>
    <h5>Create an account  <a href="register.html">Signup</a></h5>
  </form>

  </div>

</div>

<script >
 
function togglePassword() {
  const password = document.getElementById("password");
  const icon = document.querySelector(".toggle");

  if (password.type === "password") {
    password.type = "text";
    icon.classList.replace("bi-eye-slash","bi-eye");
  } else {
    password.type = "password";
    icon.classList.replace("bi-eye","bi-eye-slash");
  }
}

function login(e) {
  e.preventDefault(); 

  const role = document.getElementById("role").value;
  const email = document.getElementById("email").value;

 
  if (role === "" || email === "") {
    alert("Please fill all fields");
    return;
  }

  localStorage.setItem("userEmail", email);
  localStorage.setItem("userRole", role);

  if (role === "admin") {
    window.location.href = "admin.html";
  } else {
    window.location.href = "User.html";
  }
}
</script>

</body>
</html>
